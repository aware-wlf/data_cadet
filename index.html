<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<meta charset="utf-8">
<title>Principles &amp; Positioning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EA;
    --surface:#FFFFFF;
    --surface-2:#FBFAF6;
    --ink:#242119;
    --ink-soft:#6B6659;
    --ink-faint:#9A9486;
    --line:#DEDACE;
    --line-strong:#C9C3B4;
    --accent:#6B5CA0;
    --accent-hover:#584C87;
    --accent-soft:#EDE8F7;
    --accent-ink:#3E3466;
    --danger:#A8493B;
    --shadow: 0 1px 2px rgba(36,33,25,0.04), 0 8px 24px -12px rgba(36,33,25,0.18);
    --radius: 16px;
    --font-display: 'Fraunces', ui-serif, Georgia, serif;
    --font-body: 'Public Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1A17;
      --surface:#242220;
      --surface-2:#2A2723;
      --ink:#ECE7DB;
      --ink-soft:#A39D8C;
      --ink-faint:#78725F;
      --line:#3B372F;
      --line-strong:#4A453A;
      --accent:#B7A6E8;
      --accent-hover:#C9BBF0;
      --accent-soft:#332C4E;
      --accent-ink:#D9CDF5;
      --danger:#D98E7F;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1A17;
    --surface:#242220;
    --surface-2:#2A2723;
    --ink:#ECE7DB;
    --ink-soft:#A39D8C;
    --ink-faint:#78725F;
    --line:#3B372F;
    --line-strong:#4A453A;
    --accent:#B7A6E8;
    --accent-hover:#C9BBF0;
    --accent-soft:#332C4E;
    --accent-ink:#D9CDF5;
    --danger:#D98E7F;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100svh;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:inherit;}
  input,textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    border-radius:10px;
    padding:11px 13px;
    font-size:15.5px;
    line-height:1.45;
    transition:border-color .15s ease, background .15s ease;
  }
  input::placeholder,textarea::placeholder{color:var(--ink-faint);}
  input:focus,textarea:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--surface);
  }
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  textarea{resize:vertical; min-height:88px;}

  .app{
    max-width:640px;
    margin:0 auto;
    width:100%;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:100svh;
  }

  /* header / progress */
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    padding:14px 20px 10px;
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:9px;
  }
  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent-ink);
  }
  .step-count{
    font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .track{ height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  .fill{ height:100%; background:var(--accent); border-radius:2px; transition:width .3s ease; }

  main{ flex:1; overflow-y:auto; padding:28px 20px 40px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px 24px;
  }
  .q-head{ margin-bottom:6px; font-size:22px; line-height:1.28; }
  .q-help{
    margin-top:8px; margin-bottom:20px;
    color:var(--ink-soft); font-size:14px; line-height:1.55;
  }
  .q-help ul{ margin:8px 0 0; padding-left:18px; }
  .q-help li{ margin:2px 0; }
  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block; font-size:13px; font-weight:600; color:var(--ink-soft);
    margin-bottom:6px;
  }

  /* dynamic group rows */
  .rows{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .row-card{
    position:relative;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 40px 14px 14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .row-remove{
    position:absolute; top:9px; right:9px;
    width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .row-remove:hover{ color:var(--danger); border-color:var(--danger); }
  .add-btn{
    width:100%;
    border:1.5px dashed var(--line-strong);
    background:transparent;
    color:var(--accent-ink);
    font-weight:600; font-size:14.5px;
    border-radius:12px;
    padding:13px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:46px;
  }
  .add-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }

  /* linked group */
  .linked-card{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:14px; display:flex; flex-direction:column; gap:10px; margin-bottom:12px;
  }
  .chip{
    display:inline-flex; align-self:flex-start;
    background:var(--accent-soft); color:var(--accent-ink);
    font-weight:600; font-size:14px;
    padding:5px 12px; border-radius:999px;
  }
  .empty-note{
    color:var(--ink-faint); font-size:14px; font-style:italic;
    padding:10px 2px;
  }

  /* rank */
  .rank-list{ display:flex; flex-direction:column; gap:10px; }
  .rank-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px;
  }
  .rank-badge{
    width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    flex-shrink:0; font-variant-numeric:tabular-nums;
  }
  .rank-name{ flex:1; font-weight:600; font-size:15px; }
  .rank-arrows{ display:flex; gap:4px; }
  .rank-arrows button{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .rank-arrows button:disabled{ opacity:.35; }
  .rank-arrows button:not(:disabled):hover{ border-color:var(--accent); color:var(--accent); }

  /* footer nav */
  .footer{
    position:sticky; bottom:0; z-index:5;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:10px;
  }
  .btn{
    flex:1;
    border:none; border-radius:11px;
    padding:13px 16px; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    min-height:48px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--line-strong); color:var(--ink); }
  .btn:disabled{ opacity:.4; }

  /* welcome */
  .welcome{ display:flex; flex-direction:column; justify-content:center; flex:1; padding:40px 24px 32px; gap:22px; text-align:left; }
  .welcome h1{ font-size:34px; line-height:1.15; }
  .welcome p{ color:var(--ink-soft); font-size:15.5px; line-height:1.6; }
  .welcome .meta{ font-size:13px; color:var(--ink-faint); }

  /* results */
  .results{ padding:28px 20px 40px; display:flex; flex-direction:column; gap:22px; }
  .results h1{ font-size:30px; }
  .results-intro{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; }
  .doc{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:8px 4px;
  }
  .doc-section{ padding:20px 22px; }
  .doc-section + .doc-section{ border-top:1px solid var(--line); }
  .doc-section h2{ font-size:20px; color:var(--accent-ink); margin-bottom:14px; }
  .doc-q{ margin-bottom:16px; }
  .doc-q:last-child{ margin-bottom:0; }
  .doc-q .qtext{ font-weight:600; font-size:14.5px; margin-bottom:5px; }
  .doc-q .avalue{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; white-space:pre-wrap; }
  .doc-q ul{ margin:4px 0 0; padding-left:20px; color:var(--ink-soft); font-size:14.5px; line-height:1.6;}
  .doc-q li{ margin:3px 0; }
  .doc-q li b{ color:var(--ink); }
  .result-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-secondary{ background:var(--accent-soft); color:var(--accent-ink); flex:none; padding:12px 18px; }
  .btn-secondary:hover{ background:var(--line); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border:1px solid var(--line); flex:none; padding:12px 18px; }
  .btn-danger-ghost:hover{ border-color:var(--danger); }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  svg{ display:block; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "pp-workbook-v1";

  var SECTIONS = {
    values:     "Principles &amp; Values",
    fit:        "What Fits You",
    product:    "Your Product",
    positioning:"Positioning"
  };

  var STEPS = [
    { id:"brainstorm", section:"values", type:"group", startRows:4,
      label:"Write down every value you think you live by — or want to live by. Minimum 10",
      help:"No filtering yet. Get it all down: integrity, curiosity, family, freedom, craft, whatever surfaces.",
      fields:[ {key:"value", label:"Value", placeholder:"e.g. Curiosity"} ] },

    { id:"top5", section:"values", type:"group", startRows:5,
      label:"Now reduce that list to the 5 values that represent you most.",
      help:"For each one, name it, then capture what it means to you and why it represents you.",
      fields:[
        {key:"name", label:"Value", placeholder:"e.g. Integrity"},
        {key:"meaning", label:"What it means to you", placeholder:"Write a sentence or two.", textarea:true},
        {key:"why", label:"Why it represents you", placeholder:"Write a sentence or two.", textarea:true}
      ] },

    { id:"rank", section:"values", type:"rank",
      label:"Rank your 5 values, 1 (most important) to 5 (least).",
      help:"Use the arrows to reorder — top of the list is your #1.",
      source:{ stepId:"top5", key:"name" } },

    { id:"principle", section:"values", type:"textarea", rows:4,
      label:"Write a principle you want to live by.",
      help:"1–2 sentences, drawn from the values above.",
      placeholder:"I live by…" },

    { id:"passions", section:"fit", type:"textarea", rows:5,
      label:"What are your passions, hobbies, and interests?",
      placeholder:"Write freely — anything that energizes you." },

    { id:"sectorsInterested", section:"fit", type:"group", startRows:3,
      label:"Which sectors interest you?",
      help:"Hard to narrow down? Search “list of business sectors” and skim it — or start with a Not Interested list on the next screen instead.",
      fields:[
        {key:"name", label:"Sector", placeholder:"e.g. Healthcare"},
        {key:"why", label:"Why it matters to you", textarea:true}
      ] },

    { id:"sectorsNot", section:"fit", type:"group", startRows:3,
      label:"Which sectors are you sure you don't want?",
      help:"Sometimes it's easier to rule things out first.",
      fields:[ {key:"name", label:"Sector", placeholder:"e.g. Fossil fuels"} ] },

    { id:"industries", section:"fit", type:"group", startRows:3,
      label:"Within the sectors you're drawn to, which industries interest you?",
      help:"Do a quick search of what industries sit inside your chosen sectors.",
      fields:[
        {key:"name", label:"Industry", placeholder:"e.g. Digital health"},
        {key:"why", label:"Why it matters to you", textarea:true}
      ] },

    { id:"fulfillment", section:"fit", type:"group", startRows:3,
      label:"What would fulfill you to work on?",
      help:"A type of person, problem, or issue — e.g. mental health, immigration, diagnosis, climate change. Set feelings aside and write down the logic: this matters later, when excitement about an offer makes it hard to think clearly about fit.",
      fields:[
        {key:"type", label:"Person, problem, or issue", placeholder:"e.g. Mental health"},
        {key:"why", label:"Why it matters to you", textarea:true}
      ] },

    { id:"mustHaves", section:"fit", type:"group", startRows:3,
      label:"What must your employer, team, or culture have?",
      help:"Non-negotiables.",
      fields:[
        {key:"name", label:"Must-have", placeholder:"e.g. Remote-first"},
        {key:"why", label:"Why it matters to you", textarea:true}
      ] },

    { id:"niceToHaves", section:"fit", type:"group", startRows:3,
      label:"What would be nice to have, but isn't a dealbreaker?",
      fields:[
        {key:"name", label:"Nice-to-have", placeholder:"e.g. Learning stipend"},
        {key:"why", label:"Why it matters to you", textarea:true}
      ] },

    { id:"employers", section:"fit", type:"group", startRows:3,
      label:"What employers are you interested in?",
      help:"No list yet? Search for employers that match your answers so far.",
      fields:[ {key:"name", label:"Employer", placeholder:"e.g. Acme Health"} ] },

    { id:"employerDetail", section:"fit", type:"linkedGroup",
      label:"For each employer, why them — and which teams?",
      source:{ stepId:"employers", key:"name" },
      emptyNote:"Add some employers on the previous screen first.",
      fields:[
        {key:"why", label:"Why you're interested in them as a whole", textarea:true},
        {key:"teams", label:"Departments or teams you're interested in", textarea:true}
      ] },

    { id:"valuesAlign", section:"fit", type:"fields",
      label:"Do your values align with the employers or teams above?",
      help:"If one clearly aligns, name it below — that's your highlighted employer. If none do, that's worth noticing too.",
      fields:[
        {key:"reflection", label:"Reflection", textarea:true, rows:4},
        {key:"highlight", label:"Highlighted employer (if any)", placeholder:"e.g. Acme Health"}
      ] },

    { id:"missionAlign", section:"fit", type:"textarea", rows:4,
      label:"Does the highlighted employer's mission align with your principle statement?" },

    { id:"strengths", section:"fit", type:"group", startRows:3,
      label:"List your strengths for your target role.",
      fields:[ {key:"name", label:"Strength", placeholder:"e.g. Translating data into stories"} ] },

    { id:"strengthDetail", section:"fit", type:"linkedGroup",
      label:"For each strength — why it's you, and how it helps an employer.",
      source:{ stepId:"strengths", key:"name" },
      emptyNote:"Add some strengths on the previous screen first.",
      fields:[
        {key:"unique", label:"Why you're amazing or unique because of it", textarea:true},
        {key:"helps", label:"How this helps the employer", textarea:true}
      ] },

    { id:"summary", section:"product", type:"textarea", rows:9,
      label:"Summarize yourself in a paragraph or two.",
      help:"Use your previous answers to cover:<ul><li>Who you are</li><li>A bit about your journey to get here</li><li>Your top 3–5 qualities or strengths</li><li>How those strengths help an employer</li></ul>" },

    { id:"niche", section:"positioning", type:"fields",
      label:"Choose your niche.",
      help:"You don't need every box — use whichever framing clicks for you.",
      fields:[
        {key:"domain", label:"Industry / Sector / Domain", placeholder:"e.g. Healthcare"},
        {key:"subcategory", label:"Subcategory of your role", placeholder:"e.g. NLP Data Scientist"},
        {key:"problem", label:"Type of problem you solve", placeholder:"e.g. Customer segmentation"},
        {key:"tool", label:"Tool or platform", placeholder:"e.g. GCP migrations"},
        {key:"background", label:"Your background or favorite past projects", textarea:true},
        {key:"problemMethod", label:"Problem + method", placeholder:"e.g. Marketing spend via mixed media modeling"}
      ] },

    { id:"audience", section:"positioning", type:"textarea", rows:4,
      label:"What's your location or audience?",
      help:"A certain region or market? Startups, small business, or large enterprise?" },

    { id:"bridging", section:"positioning", type:"textarea", rows:4,
      label:"How does your previous experience help you stand out?",
      help:"e.g. 5+ years as a loan officer + 3+ years as a data scientist = “mortgage data scientist.” Note any unique combination of skills or industry knowledge." },

    { id:"quantify", section:"positioning", type:"group", startRows:2,
      label:"Quantify whenever possible.",
      help:"e.g. “placed 10 candidates in 2022, 17 in 2023, 22 in 2024” or “reduced ad spend 20% while achieving 2x ROI in 6 months.” Numbers are social proof.",
      fields:[ {key:"metric", label:"Metric or result", placeholder:"e.g. Reduced ad spend 20% while 2x-ing ROI in 6 months"} ] },

    { id:"lacking", section:"positioning", type:"textarea", rows:4,
      label:"Lacking some skills or domain knowledge?",
      help:"No worries — emphasize your other strengths: technical, soft skills, adaptability. If you want a domain switch, show how your past experience still transfers." },

    { id:"positioningStatement", section:"positioning", type:"textarea", rows:6,
      label:"Write your positioning statement.",
      help:"What you do, who you do it for, how you do it, what the result is. Example: “I help product, marketing, and sales teams turn behavioral data into visual stories that move teams to act — storytelling that shaped a $9.2B strategic pivot at PlayStation, drawn from 10+ years in reporting, analytics, and strategy.”<br><br>Only position yourself for what you actually want to do next." },

    { id:"boldSentence", section:"positioning", type:"textarea", rows:3,
      label:"Turn it into one bold, catchy sentence.",
      help:"Template: “I (verb) (noun) (verb) (noun) and/to (adjective) (noun).”<br>Example: “I help global marketing teams use behavioral data to raise brand awareness and purchase intent.”" }
  ];

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var parsed = JSON.parse(raw); if(parsed && typeof parsed==="object") return parsed; }
    }catch(e){}
    return { step:-1, done:false, answers:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var app = document.getElementById("app");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function icon(name){
    var paths = {
      plus:'<path d="M8 3v10M3 8h10"/>',
      x:'<path d="M4 4l8 8M12 4l-8 8"/>',
      up:'<path d="M4 10l4-4 4 4"/>',
      down:'<path d="M4 6l4 4 4-4"/>',
      copy:'<rect x="6" y="6" width="8" height="8" rx="1.5"/><path d="M4 10.5V3.5A1.5 1.5 0 0 1 5.5 2h7"/>',
      chevL:'<path d="M10 3L6 8l4 5"/>',
      chevR:'<path d="M6 3l4 5-4 5"/>'
    };
    return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||"")+'</svg>';
  }

  function ensureGroup(step){
    var arr = state.answers[step.id];
    if(!Array.isArray(arr)){
      arr = [];
      var n = step.startRows || 1;
      for(var i=0;i<n;i++) arr.push({});
      state.answers[step.id] = arr;
    }
    return arr;
  }
  function ensureLinked(step){
    var obj = state.answers[step.id];
    if(!obj || typeof obj!=="object" || Array.isArray(obj)){ obj = {}; state.answers[step.id]=obj; }
    return obj;
  }
  function ensureFields(step){
    var obj = state.answers[step.id];
    if(!obj || typeof obj!=="object" || Array.isArray(obj)){ obj = {}; state.answers[step.id]=obj; }
    return obj;
  }
  function sourceNames(source){
    var rows = state.answers[source.stepId];
    if(!Array.isArray(rows)) return [];
    var seen = {}; var out = [];
    rows.forEach(function(r){
      var v = (r[source.key]||"").trim();
      if(v && !seen[v]){ seen[v]=true; out.push(v); }
    });
    return out;
  }

  function fieldHtml(f, value, dataAttrs){
    var val = esc(value||"");
    var attrs = dataAttrs + ' placeholder="'+esc(f.placeholder||"")+'"';
    if(f.textarea){
      return '<div class="field"><label>'+esc(f.label)+'</label>'+
        '<textarea '+attrs+' rows="'+(f.rows||3)+'">'+val+'</textarea></div>';
    }
    return '<div class="field"><label>'+esc(f.label)+'</label>'+
      '<input type="text" '+attrs+' value="'+val+'"></div>';
  }

  function renderStepBody(step){
    if(step.type==="text" || step.type==="textarea"){
      var val = state.answers[step.id]||"";
      var attrs = 'data-step="'+step.id+'" placeholder="'+esc(step.placeholder||"")+'"';
      return step.type==="textarea"
        ? '<textarea '+attrs+' rows="'+(step.rows||5)+'">'+esc(val)+'</textarea>'
        : '<input type="text" '+attrs+' value="'+esc(val)+'">';
    }

    if(step.type==="fields"){
      var obj = ensureFields(step);
      return step.fields.map(function(f){
        var attrs = 'data-step="'+step.id+'" data-key="'+f.key+'"';
        return fieldHtml(f, obj[f.key], attrs);
      }).join("");
    }

    if(step.type==="group"){
      var rows = ensureGroup(step);
      var rowsHtml = rows.map(function(row, idx){
        var inner = step.fields.map(function(f){
          var attrs = 'data-step="'+step.id+'" data-idx="'+idx+'" data-key="'+f.key+'"';
          return fieldHtml(f, row[f.key], attrs);
        }).join("");
        return '<div class="row-card">'+inner+
          '<button type="button" class="row-remove" data-action="remove-row" data-step="'+step.id+'" data-idx="'+idx+'" aria-label="Remove">'+icon("x")+'</button></div>';
      }).join("");
      return '<div class="rows">'+rowsHtml+'</div>'+
        '<button type="button" class="add-btn" data-action="add-row" data-step="'+step.id+'">'+icon("plus")+' Add another</button>';
    }

    if(step.type==="linkedGroup"){
      var names = sourceNames(step.source);
      var map = ensureLinked(step);
      if(names.length===0){
        return '<p class="empty-note">'+esc(step.emptyNote||"Add entries in an earlier step first.")+'</p>';
      }
      return names.map(function(name){
        var rowData = map[name] || (map[name]={});
        var inner = step.fields.map(function(f){
          var attrs = 'data-step="'+step.id+'" data-linked="'+esc(name)+'" data-key="'+f.key+'"';
          return fieldHtml(f, rowData[f.key], attrs);
        }).join("");
        return '<div class="linked-card"><span class="chip">'+esc(name)+'</span>'+inner+'</div>';
      }).join("");
    }

    if(step.type==="rank"){
      var srcNames = sourceNames(step.source);
      var order = state.answers[step.id];
      var sameSet = Array.isArray(order) && order.length===srcNames.length &&
        order.every(function(n){ return srcNames.indexOf(n)!==-1; });
      if(!sameSet){ order = srcNames.slice(); state.answers[step.id]=order; }
      if(order.length===0){
        return '<p class="empty-note">Add your top 5 values in an earlier step first.</p>';
      }
      return '<div class="rank-list">'+order.map(function(name, idx){
        return '<div class="rank-row">'+
          '<div class="rank-badge">'+(idx+1)+'</div>'+
          '<div class="rank-name">'+esc(name)+'</div>'+
          '<div class="rank-arrows">'+
            '<button type="button" data-action="rank-up" data-step="'+step.id+'" data-idx="'+idx+'" '+(idx===0?"disabled":"")+'>'+icon("up")+'</button>'+
            '<button type="button" data-action="rank-down" data-step="'+step.id+'" data-idx="'+idx+'" '+(idx===order.length-1?"disabled":"")+'>'+icon("down")+'</button>'+
          '</div></div>';
      }).join("")+'</div>';
    }

    return "";
  }

  function render(){
    if(state.done){ renderResults(); return; }
    if(typeof state.step!=="number") state.step=-1;
    if(state.step===-1){ renderWelcome(); return; }
    if(state.step<0) state.step=0;
    if(state.step>=STEPS.length){ state.done=true; saveState(); renderResults(); return; }

    var step = STEPS[state.step];
    var total = STEPS.length;
    var pct = Math.round((state.step)/total*100);

    app.innerHTML =
      '<div class="topbar">'+
        '<div class="topbar-row">'+
          '<span class="eyebrow">'+SECTIONS[step.section]+'</span>'+
          '<span class="step-count">Step '+(state.step+1)+' of '+total+'</span>'+
        '</div>'+
        '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '</div>'+
      '<main><div class="card">'+
        '<h2 class="q-head">'+esc(step.label)+'</h2>'+
        (step.help? '<div class="q-help">'+ (/[<]/.test(step.help)? step.help : esc(step.help)) +'</div>' : '<div style="margin-bottom:20px"></div>')+
        renderStepBody(step)+
      '</div></main>'+
      '<div class="footer">'+
        '<button type="button" class="btn btn-ghost" data-action="back">'+icon("chevL")+' Back</button>'+
        '<button type="button" class="btn btn-primary" data-action="next">'+(state.step===total-1? "Finish" : "Next")+' '+icon("chevR")+'</button>'+
      '</div>';
  }

  function renderWelcome(){
    app.innerHTML =
      '<div class="welcome">'+
        '<span class="eyebrow">A GUIDED WORKBOOK</span>'+
        '<h1>Principles &amp; Positioning</h1>'+
        '<p>A short, honest walk through what you value, what fits you, and how to describe it clearly — for a role, a career pivot, or just your own clarity.</p>'+
        '<p>Answer at your own pace. Everything saves automatically in this browser, so you can close this tab and pick up right where you left off.</p>'+
        '<p class="meta">'+STEPS.length+' short screens · no wrong answers</p>'+
        '<button type="button" class="btn btn-primary" data-action="begin" style="align-self:flex-start; padding:14px 26px;">Begin '+icon("chevR")+'</button>'+
      '</div>';
  }

  function fmtList(items){
    return '<ul>'+items.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ul>';
  }

  function stepHasContent(step){
    var v = state.answers[step.id];
    if(step.type==="text"||step.type==="textarea") return !!(v && v.trim());
    if(step.type==="fields") return v && Object.keys(v).some(function(k){ return (v[k]||"").trim(); });
    if(step.type==="group") return Array.isArray(v) && v.some(function(r){ return Object.keys(r).some(function(k){ return (r[k]||"").trim(); }); });
    if(step.type==="linkedGroup"){
      var names = sourceNames(step.source);
      if(!v) return false;
      return names.some(function(n){ var r=v[n]; return r && Object.keys(r).some(function(k){ return (r[k]||"").trim(); }); });
    }
    if(step.type==="rank") return Array.isArray(v) && v.length>0;
    return false;
  }

  function stepDocHtml(step){
    var v = state.answers[step.id];
    if(step.type==="text" || step.type==="textarea"){
      return '<div class="avalue">'+esc(v)+'</div>';
    }
    if(step.type==="fields"){
      var parts = step.fields.filter(function(f){ return v[f.key] && v[f.key].trim(); })
        .map(function(f){ return '<li><b>'+esc(f.label)+':</b> '+esc(v[f.key])+'</li>'; });
      return parts.length? '<ul>'+parts.join("")+'</ul>' : "";
    }
    if(step.type==="group"){
      var rows = (v||[]).filter(function(r){ return Object.keys(r).some(function(k){ return (r[k]||"").trim(); }); });
      if(!rows.length) return "";
      if(step.fields.length===1){
        var key = step.fields[0].key;
        return fmtList(rows.map(function(r){ return esc(r[key]||""); }));
      }
      return '<ul>'+rows.map(function(r){
        var head = esc(r[step.fields[0].key]||"(untitled)");
        var rest = step.fields.slice(1).filter(function(f){ return (r[f.key]||"").trim(); })
          .map(function(f){ return '<div style="margin-top:2px;"><b>'+esc(f.label)+':</b> '+esc(r[f.key])+'</div>'; }).join("");
        return '<li><b>'+head+'</b>'+rest+'</li>';
      }).join("")+'</ul>';
    }
    if(step.type==="linkedGroup"){
      var names = sourceNames(step.source);
      var map = v||{};
      var items = names.filter(function(n){ var r=map[n]; return r && Object.keys(r).some(function(k){ return (r[k]||"").trim(); }); })
        .map(function(n){
          var r = map[n];
          var rest = step.fields.filter(function(f){ return (r[f.key]||"").trim(); })
            .map(function(f){ return '<div style="margin-top:2px;"><b>'+esc(f.label)+':</b> '+esc(r[f.key])+'</div>'; }).join("");
          return '<li><b>'+esc(n)+'</b>'+rest+'</li>';
        });
      return items.length? '<ul>'+items.join("")+'</ul>' : "";
    }
    if(step.type==="rank"){
      return '<ul>'+(v||[]).map(function(n,i){ return '<li><b>'+(i+1)+'.</b> '+esc(n)+'</li>'; }).join("")+'</ul>';
    }
    return "";
  }

  function buildPlainText(){
    var lines = ["PRINCIPLES & POSITIONING", ""];
    var lastSection = null;
    STEPS.forEach(function(step){
      if(!stepHasContent(step)) return;
      if(step.section!==lastSection){
        lastSection = step.section;
        lines.push("", SECTIONS[step.section].toUpperCase(), "");
      }
      lines.push(step.label.replace(/<[^>]+>/g,""));
      var v = state.answers[step.id];
      if(step.type==="text"||step.type==="textarea"){
        lines.push(v);
      } else if(step.type==="fields"){
        step.fields.forEach(function(f){ if(v[f.key]&&v[f.key].trim()) lines.push("- "+f.label+": "+v[f.key]); });
      } else if(step.type==="group"){
        (v||[]).forEach(function(r){
          if(!Object.keys(r).some(function(k){return (r[k]||"").trim();})) return;
          lines.push("- "+step.fields.map(function(f){ return r[f.key]?f.label+": "+r[f.key]:null; }).filter(Boolean).join(" | "));
        });
      } else if(step.type==="linkedGroup"){
        sourceNames(step.source).forEach(function(n){
          var r=(v||{})[n];
          if(!r || !Object.keys(r).some(function(k){return (r[k]||"").trim();})) return;
          lines.push("- "+n+": "+step.fields.map(function(f){ return r[f.key]?f.label+": "+r[f.key]:null; }).filter(Boolean).join(" | "));
        });
      } else if(step.type==="rank"){
        (v||[]).forEach(function(n,i){ lines.push((i+1)+". "+n); });
      }
      lines.push("");
    });
    return lines.join("\n");
  }

  function renderResults(){
    var sectionsHtml = "";
    var lastSection = null;
    var buf = "";
    STEPS.forEach(function(step){
      if(!stepHasContent(step)) return;
      if(step.section!==lastSection){
        if(buf) sectionsHtml += '<div class="doc-section"><h2>'+SECTIONS[lastSection]+'</h2>'+buf+'</div>';
        buf = ""; lastSection = step.section;
      }
      buf += '<div class="doc-q"><div class="qtext">'+esc(step.label)+'</div>'+stepDocHtml(step)+'</div>';
    });
    if(buf) sectionsHtml += '<div class="doc-section"><h2>'+SECTIONS[lastSection]+'</h2>'+buf+'</div>';

    if(!sectionsHtml){
      sectionsHtml = '<div class="doc-section"><p class="empty-note">No answers yet.</p></div>';
    }

    app.innerHTML =
      '<div class="results">'+
        '<div>'+
          '<span class="eyebrow">YOUR WORKBOOK</span>'+
          '<h1 style="margin-top:6px;">Your answers</h1>'+
        '</div>'+
        '<p class="results-intro">Everything you wrote, gathered in one place. Copy it out, keep refining, or come back and edit any answer.</p>'+
        '<div class="result-actions">'+
          '<button type="button" class="btn btn-secondary" data-action="copy">'+icon("copy")+' Copy all as text</button>'+
          '<button type="button" class="btn btn-ghost" style="flex:none;" data-action="edit">'+icon("chevL")+' Edit answers</button>'+
          '<button type="button" class="btn btn-danger-ghost" data-action="reset">Start over</button>'+
        '</div>'+
        '<div class="doc">'+sectionsHtml+'</div>'+
      '</div>';
  }

  app.addEventListener("input", function(e){
    var t = e.target;
    if(!(t.matches("input,textarea"))) return;
    var sId = t.dataset.step;
    if(!sId) return;
    if(t.dataset.idx!==undefined && t.dataset.idx!==""){
      var arr = state.answers[sId];
      var idx = parseInt(t.dataset.idx,10);
      if(Array.isArray(arr) && arr[idx]) arr[idx][t.dataset.key] = t.value;
    } else if(t.dataset.linked){
      var map = state.answers[sId];
      if(!map) map = state.answers[sId] = {};
      if(!map[t.dataset.linked]) map[t.dataset.linked] = {};
      map[t.dataset.linked][t.dataset.key] = t.value;
    } else if(t.dataset.key){
      var obj = state.answers[sId];
      if(!obj || typeof obj!=="object") obj = state.answers[sId] = {};
      obj[t.dataset.key] = t.value;
    } else {
      state.answers[sId] = t.value;
    }
    saveState();
  });

  app.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn) return;
    var action = btn.dataset.action;
    if(!action) return;

    if(action==="begin"){
      state.step = 0; saveState(); render(); scrollTop(); return;
    }
    if(action==="back"){
      if(state.step>0){ state.step--; } else { state.step=-1; }
      saveState(); render(); scrollTop(); return;
    }
    if(action==="next"){
      if(state.step===STEPS.length-1){ state.done=true; }
      else { state.step++; }
      saveState(); render(); scrollTop(); return;
    }
    if(action==="add-row"){
      var step = STEPS.find(function(s){ return s.id===btn.dataset.step; });
      ensureGroup(step).push({});
      saveState(); render(); return;
    }
    if(action==="remove-row"){
      var arr = state.answers[btn.dataset.step];
      arr.splice(parseInt(btn.dataset.idx,10),1);
      saveState(); render(); return;
    }
    if(action==="rank-up" || action==="rank-down"){
      var order = state.answers[btn.dataset.step];
      var i = parseInt(btn.dataset.idx,10);
      var j = action==="rank-up" ? i-1 : i+1;
      if(j<0 || j>=order.length) return;
      var tmp = order[i]; order[i]=order[j]; order[j]=tmp;
      saveState(); render(); return;
    }
    if(action==="edit"){
      state.done=false; state.step=0; saveState(); render(); scrollTop(); return;
    }
    if(action==="reset"){
      if(confirm("Clear every answer and start over? This can't be undone.")){
        state = { step:-1, done:false, answers:{} };
        saveState(); render(); scrollTop();
      }
      return;
    }
    if(action==="copy"){
      var text = buildPlainText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast("Copied to clipboard"); })
          .catch(function(){ toast("Couldn't copy — select and copy manually"); });
      } else {
        toast("Copy not supported in this browser");
      }
      return;
    }
  });

  function scrollTop(){ window.scrollTo(0,0); }

  if(typeof state.step!=="number") state.step = -1;
  render();
})();
</script>

</body></html>
